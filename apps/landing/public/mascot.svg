        <svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#E8E8E8"/>
            </radialGradient>
            <radialGradient id="bellyGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#F5F5F5"/>
            </radialGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000015"/>
            </filter>
          </defs>

          <!-- TAIL (behind body) -->
          <path d="M215 240 Q265 210 258 165 Q252 130 228 145 Q218 152 222 168 Q228 188 210 200" 
                stroke="#1A1A2E" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Tail tip lighter -->
          <path d="M222 168 Q228 188 210 200" 
                stroke="#2D2D4E" stroke-width="14" fill="none" stroke-linecap="round"/>

          <!-- BODY -->
          <ellipse cx="148" cy="200" rx="72" ry="68" fill="url(#bodyGrad)" filter="url(#softShadow)"/>
          <!-- Belly fur texture -->
          <ellipse cx="148" cy="210" rx="38" ry="44" fill="url(#bellyGrad)" opacity="0.9"/>
          <!-- Belly center line subtle -->
          <path d="M148 172 Q148 220 148 248" stroke="#E0E0E0" stroke-width="1" opacity="0.5"/>

          <!-- LEFT EAR (black) -->
          <path d="M88 88 Q68 42 95 30 Q110 55 118 78 Z" fill="#1A1A2E"/>
          <!-- Left ear inner pink -->
          <path d="M92 82 Q76 50 96 40 Q107 58 113 76 Z" fill="#e8a8a8" opacity="0.7"/>

          <!-- RIGHT EAR (black) -->
          <path d="M212 88 Q232 42 205 30 Q190 55 182 78 Z" fill="#1A1A2E"/>
          <!-- Right ear inner pink -->
          <path d="M208 82 Q224 50 204 40 Q193 58 187 76 Z" fill="#e8a8a8" opacity="0.7"/>

          <!-- HEAD -->
          <ellipse cx="150" cy="130" rx="74" ry="70" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

          <!-- Black patch on top/left of head (like the real cat) -->
          <path d="M88 88 Q95 75 118 70 Q125 95 108 108 Q96 102 88 88 Z" fill="#1A1A2E" opacity="0.85"/>

          <!-- Eyes closed happy -->
          <path d="M108 115 Q122 104 136 115" stroke="#1A1A2E" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M164 115 Q178 104 192 115" stroke="#1A1A2E" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <!-- Blush -->
          <ellipse cx="108" cy="130" rx="14" ry="8" fill="#FF6B00" opacity="0.15"/>
          <ellipse cx="192" cy="130" rx="14" ry="8" fill="#FF6B00" opacity="0.15"/>
          <!-- Nose -->
          <path d="M144 138 L150 145 L156 138 Q150 135 144 138 Z" fill="#E87070"/>
          <!-- Big happy smile -->
          <path d="M132 148 Q150 165 168 148" stroke="#C05050" stroke-width="2.5" fill="none" stroke-linecap="round"/>

          <!-- Muzzle area (lighter) -->
          <ellipse cx="150" cy="143" rx="22" ry="14" fill="white" opacity="0.4"/>

          <!-- Whiskers left -->
          <line x1="55" y1="133" x2="118" y2="138" stroke="#888" stroke-width="1" opacity="0.5"/>
          <line x1="55" y1="141" x2="118" y2="141" stroke="#888" stroke-width="1" opacity="0.5"/>
          <line x1="60" y1="149" x2="118" y2="144" stroke="#888" stroke-width="1" opacity="0.5"/>
          <!-- Whiskers right -->
          <line x1="182" y1="138" x2="245" y2="133" stroke="#888" stroke-width="1" opacity="0.5"/>
          <line x1="182" y1="141" x2="245" y2="141" stroke="#888" stroke-width="1" opacity="0.5"/>
          <line x1="182" y1="144" x2="240" y2="149" stroke="#888" stroke-width="1" opacity="0.5"/>

          <!-- FRONT PAWS -->
          <!-- Left paw -->
          <ellipse cx="108" cy="258" rx="26" ry="18" fill="url(#bodyGrad)"/>
          <!-- Paw toes -->
          <ellipse cx="96" cy="262" rx="8" ry="6" fill="#F0F0F0"/>
          <ellipse cx="108" cy="265" rx="8" ry="6" fill="#F0F0F0"/>
          <ellipse cx="120" cy="262" rx="8" ry="6" fill="#F0F0F0"/>

          <!-- Right paw -->
          <ellipse cx="192" cy="258" rx="26" ry="18" fill="url(#bodyGrad)"/>
          <ellipse cx="180" cy="262" rx="8" ry="6" fill="#F0F0F0"/>
          <ellipse cx="192" cy="265" rx="8" ry="6" fill="#F0F0F0"/>
          <ellipse cx="204" cy="262" rx="8" ry="6" fill="#F0F0F0"/>

          <!-- DELIVERY BOX (pizza box) -->
          <!-- Bag strap -->
          <rect x="124" y="174" width="48" height="20" rx="10" fill="#2D2D4E"/>
          <rect x="136" y="174" width="24" height="6" rx="3" fill="#3D3D6E"/>
          <!-- Box body -->
          <rect x="110" y="188" width="76" height="52" rx="10" fill="#FF6B00"/>
          <!-- Box lid -->
          <rect x="110" y="188" width="76" height="18" rx="10" fill="#E85A00"/>
          <!-- Box label white -->
          <rect x="122" y="194" width="52" height="6" rx="3" fill="white" opacity="0.3"/>
          <!-- Box text -->
          <text x="148" y="200" text-anchor="middle" fill="white" font-size="5" font-family="sans-serif" font-weight="bold" opacity="0.8">NINO DELIVERY</text>
          <!-- Box bottom detail -->
          <line x1="110" y1="206" x2="186" y2="206" stroke="#E85A00" stroke-width="1.5" opacity="0.5"/>
          <!-- Nino cat logo on box -->
          <circle cx="148" cy="224" r="12" fill="white" opacity="0.15"/>
          <text x="148" y="229" text-anchor="middle" font-size="16" font-family="sans-serif">🐱</text>
        </svg>
