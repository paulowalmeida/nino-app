<svg
  viewBox="0 0 300 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient id="ninoBody" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8E8E8" />
    </radialGradient>
    <radialGradient id="ninoBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F5" />
    </radialGradient>
    <filter id="ninoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000015" />
    </filter>
  </defs>

  <!-- cauda caída — sem ânimo -->
  <path
    d="M212 236 Q252 234 256 202 Q258 178 240 178 Q228 178 228 192"
    stroke="#1A1A2E"
    stroke-width="16"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- corpo -->
  <ellipse
    cx="148"
    cy="204"
    rx="72"
    ry="66"
    fill="url(#ninoBody)"
    filter="url(#ninoShadow)"
  />
  <ellipse
    cx="148"
    cy="212"
    rx="38"
    ry="42"
    fill="url(#ninoBelly)"
    opacity="0.9"
  />

  <!-- orelhas caídas para os lados -->
  <path d="M92 96 Q60 66 78 32 Q100 46 118 82 Z" fill="#1A1A2E" />
  <path
    d="M96 90 Q72 66 84 42 Q99 52 112 80 Z"
    fill="#e8a8a8"
    opacity="0.7"
  />
  <path d="M208 96 Q240 66 222 32 Q200 46 182 82 Z" fill="#1A1A2E" />
  <path
    d="M204 90 Q228 66 216 42 Q201 52 188 80 Z"
    fill="#e8a8a8"
    opacity="0.7"
  />

  <!-- cabeça baixa, levemente inclinada pra frente -->
  <g transform="translate(0 8) rotate(4 150 130)">
    <ellipse
      cx="150"
      cy="130"
      rx="74"
      ry="70"
      fill="url(#ninoBody)"
      filter="url(#ninoShadow)"
    />
    <path
      d="M88 88 Q95 75 118 70 Q125 95 108 108 Q96 102 88 88 Z"
      fill="#1A1A2E"
      opacity="0.85"
    />

    <!-- sobrancelhas caídas por dentro — tristeza -->
    <path
      d="M106 104 Q120 114 138 110"
      stroke="#1A1A2E"
      stroke-width="4.5"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M162 110 Q180 114 194 104"
      stroke="#1A1A2E"
      stroke-width="4.5"
      fill="none"
      stroke-linecap="round"
    />

    <!-- olhos semicerrados, cantos caídos -->
    <path
      d="M112 124 Q122 130 132 124"
      stroke="#1A1A2E"
      stroke-width="5"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M168 124 Q178 130 188 124"
      stroke="#1A1A2E"
      stroke-width="5"
      fill="none"
      stroke-linecap="round"
    />

    <!-- uma lagriminha -->
    <path
      d="M120 132 Q124 142 120 148 Q116 142 120 132 Z"
      fill="#7AA8D8"
      opacity="0.7"
    />

    <ellipse cx="108" cy="140" rx="14" ry="8" fill="#FF6B00" opacity="0.12" />
    <ellipse cx="192" cy="140" rx="14" ry="8" fill="#FF6B00" opacity="0.12" />
    <path d="M144 140 L150 147 L156 140 Q150 137 144 140 Z" fill="#E87070" />

    <!-- boca em arco pra baixo -->
    <path
      d="M134 162 Q150 150 166 162"
      stroke="#C05050"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />

    <line
      x1="55"
      y1="141"
      x2="118"
      y2="146"
      stroke="#888"
      stroke-width="1"
      opacity="0.4"
    />
    <line
      x1="55"
      y1="149"
      x2="118"
      y2="149"
      stroke="#888"
      stroke-width="1"
      opacity="0.4"
    />
    <line
      x1="182"
      y1="146"
      x2="245"
      y2="141"
      stroke="#888"
      stroke-width="1"
      opacity="0.4"
    />
    <line
      x1="182"
      y1="149"
      x2="245"
      y2="149"
      stroke="#888"
      stroke-width="1"
      opacity="0.4"
    />
  </g>

  <!-- patas caídas, vazias -->
  <ellipse cx="104" cy="260" rx="26" ry="17" fill="url(#ninoBody)" />
  <ellipse cx="92" cy="263" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="104" cy="266" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="116" cy="263" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="196" cy="260" rx="26" ry="17" fill="url(#ninoBody)" />
  <ellipse cx="184" cy="263" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="196" cy="266" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="208" cy="263" rx="8" ry="6" fill="#F0F0F0" />
</svg>
