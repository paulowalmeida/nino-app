<svg
  viewBox="0 0 300 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient id="ninoBody" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8E8E8" />
    </radialGradient>
    <linearGradient id="bagFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A33" />
      <stop offset="100%" stop-color="#E8540C" />
    </linearGradient>
    <filter id="ninoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000015" />
    </filter>
  </defs>

  <!--
    A loja dá a escala: o toldo passa por cima da cabeça dele e o balcão bate
    na altura do peito. Sem essa referência o mascote lia como um gato do
    tamanho do prédio.
  -->
  <g>
    <rect x="170" y="78" width="132" height="174" fill="#F4ECE0" />

    <rect x="162" y="44" width="140" height="34" fill="#E8540C" />
    <g fill="#FFF7EE" opacity="0.92">
      <rect x="176" y="44" width="14" height="34" />
      <rect x="206" y="44" width="14" height="34" />
      <rect x="236" y="44" width="14" height="34" />
      <rect x="266" y="44" width="14" height="34" />
    </g>
    <path
      d="M162 78 Q170 90 178 78 Q186 90 194 78 Q202 90 210 78 Q218 90 226 78
         Q234 90 242 78 Q250 90 258 78 Q266 90 274 78 Q282 90 290 78
         Q298 90 302 80 L302 78 Z"
      fill="#E8540C"
    />

    <rect x="162" y="180" width="140" height="12" rx="4" fill="#FFF7EE" />
    <rect x="170" y="192" width="132" height="60" fill="#EDE1CF" />
    <path d="M170 193 L302 193" stroke="#E6D9C4" stroke-width="2" />

    <!-- o pedido já embalado, esperando no balcão -->
    <g filter="url(#ninoShadow)">
      <path
        d="M232 154 Q232 146 240 146 Q248 146 248 154"
        stroke="#C24709"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"
      />
      <path d="M226 156 L256 156 L254 180 L228 180 Z" fill="url(#bagFront)" />
      <path
        d="M226 156 L256 156 L255 163 L227 163 Z"
        fill="#FFFFFF"
        opacity="0.18"
      />
    </g>
  </g>

  <!-- rastro de corrida -->
  <g stroke="#FF6B00" stroke-width="5" stroke-linecap="round" opacity="0.28">
    <path d="M6 150 L34 150" />
    <path d="M2 176 L26 176" />
    <path d="M12 202 L38 202" />
  </g>

  <ellipse cx="82" cy="252" rx="58" ry="8" fill="#1A1A2E" opacity="0.1" />

  <!-- poeirinha do pé que acabou de sair do chão -->
  <g fill="#E6D9C4" opacity="0.85">
    <circle cx="28" cy="242" r="5" />
    <circle cx="16" cy="248" r="3.5" />
  </g>

  <!-- cauda esticada pra trás -->
  <path
    d="M56 194 Q32 186 24 166"
    stroke="#1A1A2E"
    stroke-width="9"
    fill="none"
    stroke-linecap="round"
  />

  <!-- perna de trás, estendida na passada -->
  <path
    d="M70 208 Q58 226 46 240"
    stroke="#EDEDED"
    stroke-width="13"
    stroke-linecap="round"
    fill="none"
  />
  <ellipse cx="42" cy="243" rx="11" ry="7" fill="url(#ninoBody)" />

  <!-- braço de trás, jogado pra trás pelo impulso -->
  <path
    d="M68 190 Q52 195 44 208"
    stroke="#E4E4E4"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
  />

  <ellipse
    cx="80"
    cy="196"
    rx="27"
    ry="23"
    fill="url(#ninoBody)"
    filter="url(#ninoShadow)"
    transform="rotate(-14 80 196)"
  />

  <!-- perna da frente, dobrada e à frente do corpo -->
  <path
    d="M88 208 Q100 226 104 242"
    stroke="#EDEDED"
    stroke-width="13"
    stroke-linecap="round"
    fill="none"
  />
  <ellipse cx="107" cy="246" rx="11" ry="7" fill="url(#ninoBody)" />

  <!-- cabeça esticada na direção do balcão -->
  <g transform="rotate(12 100 158)">
    <path d="M80 136 Q66 108 85 101 Q94 118 98 134 Z" fill="#1A1A2E" />
    <path
      d="M84 133 Q73 111 87 107 Q93 121 96 132 Z"
      fill="#e8a8a8"
      opacity="0.7"
    />
    <path d="M120 134 Q133 106 116 99 Q108 116 104 132 Z" fill="#1A1A2E" />
    <path
      d="M117 131 Q128 109 115 105 Q109 119 106 130 Z"
      fill="#e8a8a8"
      opacity="0.7"
    />

    <ellipse
      cx="100"
      cy="158"
      rx="28"
      ry="26"
      fill="url(#ninoBody)"
      filter="url(#ninoShadow)"
    />
    <path
      d="M78 138 Q84 129 97 126 Q101 140 90 147 Q82 145 78 138 Z"
      fill="#1A1A2E"
      opacity="0.85"
    />

    <!-- olhos arregalados: já bateu o olho no pedido no balcão -->
    <ellipse cx="94" cy="158" rx="5.5" ry="7" fill="#1A1A2E" />
    <circle cx="96" cy="155" r="2" fill="#FFFFFF" />
    <ellipse cx="117" cy="156" rx="5.5" ry="7" fill="#1A1A2E" />
    <circle cx="119" cy="153" r="2" fill="#FFFFFF" />

    <ellipse cx="82" cy="169" rx="8.5" ry="5" fill="#FF6B00" opacity="0.18" />
    <ellipse cx="125" cy="167" rx="8.5" ry="5" fill="#FF6B00" opacity="0.18" />

    <path d="M98 165 L102 169 L106 165 Q102 163 98 165 Z" fill="#E87070" />

    <!-- sorriso grande e aberto -->
    <path d="M93 172 Q102 185 112 171 Q102 177 93 172 Z" fill="#C05050" />

    <g stroke="#888" stroke-width="1" opacity="0.5">
      <path d="M60 163 L78 166" />
      <path d="M59 170 L78 171" />
      <path d="M122 162 L140 159" />
      <path d="M122 169 L141 167" />
    </g>
  </g>

  <!-- braço da frente esticado pro balcão -->
  <path
    d="M102 192 Q126 195 142 202"
    stroke="#EDEDED"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
  />
  <ellipse cx="147" cy="203" rx="10" ry="7" fill="url(#ninoBody)" />
</svg>
