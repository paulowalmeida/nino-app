<svg
  viewBox="0 0 300 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient id="ninoBody" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8E8E8" />
    </radialGradient>
    <radialGradient id="ninoBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F5" />
    </radialGradient>
    <linearGradient id="bagFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A33" />
      <stop offset="100%" stop-color="#E8540C" />
    </linearGradient>
    <filter id="ninoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000015" />
    </filter>
  </defs>

  <!-- cauda -->
  <path
    d="M215 240 Q265 210 258 165 Q252 130 228 145 Q218 152 222 168 Q228 188 210 200"
    stroke="#1A1A2E"
    stroke-width="16"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- interrogação: a dúvida de quem chegou sem saber a loja -->
  <g transform="rotate(8 224 62)">
    <path
      d="M216 46 Q216 34 228 34 Q240 34 240 46 Q240 54 230 58 Q226 60 226 68"
      stroke="#FF6B00"
      stroke-width="7"
      fill="none"
      stroke-linecap="round"
    />
    <circle cx="226" cy="80" r="4.5" fill="#FF6B00" />
  </g>

  <!-- corpo -->
  <ellipse
    cx="148"
    cy="200"
    rx="72"
    ry="68"
    fill="url(#ninoBody)"
    filter="url(#ninoShadow)"
  />
  <ellipse
    cx="148"
    cy="210"
    rx="38"
    ry="44"
    fill="url(#ninoBelly)"
    opacity="0.9"
  />

  <!-- orelhas -->
  <path d="M88 88 Q68 42 95 30 Q110 55 118 78 Z" fill="#1A1A2E" />
  <path
    d="M92 82 Q76 50 96 40 Q107 58 113 76 Z"
    fill="#e8a8a8"
    opacity="0.7"
  />
  <path d="M212 88 Q232 42 205 30 Q190 55 182 78 Z" fill="#1A1A2E" />
  <path
    d="M208 82 Q224 50 204 40 Q193 58 187 76 Z"
    fill="#e8a8a8"
    opacity="0.7"
  />

  <!-- cabeça, levemente inclinada — o gesto de quem está em dúvida -->
  <g transform="rotate(-6 150 130)">
    <ellipse
      cx="150"
      cy="130"
      rx="74"
      ry="70"
      fill="url(#ninoBody)"
      filter="url(#ninoShadow)"
    />
    <path
      d="M88 88 Q95 75 118 70 Q125 95 108 108 Q96 102 88 88 Z"
      fill="#1A1A2E"
      opacity="0.85"
    />

    <!-- sobrancelhas assimétricas: uma alta, outra franzida — cara de dúvida -->
    <path
      d="M104 108 Q120 92 138 104"
      stroke="#1A1A2E"
      stroke-width="4.5"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M164 118 Q178 114 192 119"
      stroke="#1A1A2E"
      stroke-width="4.5"
      fill="none"
      stroke-linecap="round"
    />

    <!-- olhos: um mais aberto (surpreso), outro semicerrado -->
    <ellipse cx="122" cy="126" rx="7.5" ry="10" fill="#1A1A2E" />
    <circle cx="124.5" cy="122" r="2.6" fill="#FFFFFF" />
    <ellipse cx="178" cy="130" rx="7" ry="6.5" fill="#1A1A2E" />
    <circle cx="180" cy="128" r="2.2" fill="#FFFFFF" />

    <ellipse cx="108" cy="140" rx="14" ry="8" fill="#FF6B00" opacity="0.15" />
    <ellipse cx="192" cy="140" rx="14" ry="8" fill="#FF6B00" opacity="0.15" />
    <path d="M144 140 L150 147 L156 140 Q150 137 144 140 Z" fill="#E87070" />

    <!-- boca em "o" pequeno: quem tá tentando entender -->
    <ellipse cx="150" cy="156" rx="7" ry="8" fill="#C05050" />
    <ellipse cx="150" cy="154" rx="4.5" ry="5" fill="#7A2E2E" />

    <line
      x1="55"
      y1="141"
      x2="118"
      y2="146"
      stroke="#888"
      stroke-width="1"
      opacity="0.5"
    />
    <line
      x1="55"
      y1="149"
      x2="118"
      y2="149"
      stroke="#888"
      stroke-width="1"
      opacity="0.5"
    />
    <line
      x1="60"
      y1="157"
      x2="118"
      y2="152"
      stroke="#888"
      stroke-width="1"
      opacity="0.5"
    />
    <line
      x1="182"
      y1="146"
      x2="245"
      y2="141"
      stroke="#888"
      stroke-width="1"
      opacity="0.5"
    />
    <line
      x1="182"
      y1="149"
      x2="245"
      y2="149"
      stroke="#888"
      stroke-width="1"
      opacity="0.5"
    />
    <line
      x1="182"
      y1="152"
      x2="240"
      y2="157"
      stroke="#888"
      stroke-width="1"
      opacity="0.5"
    />
  </g>

  <!-- patas -->
  <ellipse cx="108" cy="258" rx="26" ry="18" fill="url(#ninoBody)" />
  <ellipse cx="96" cy="262" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="108" cy="265" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="120" cy="262" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="192" cy="258" rx="26" ry="18" fill="url(#ninoBody)" />
  <ellipse cx="180" cy="262" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="192" cy="265" rx="8" ry="6" fill="#F0F0F0" />
  <ellipse cx="204" cy="262" rx="8" ry="6" fill="#F0F0F0" />

  <!-- sacolinha de entrega, segurada à frente do corpo -->
  <g filter="url(#ninoShadow)">
    <path
      d="M118 192 Q118 176 132 176 Q146 176 146 192"
      stroke="#C24709"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M108 196 L114 250 Q114 258 122 258 L158 258 Q166 258 166 250 L156 196 Z"
      fill="url(#bagFront)"
    />
    <path
      d="M108 196 L156 196 L153 210 L111 210 Z"
      fill="#FFFFFF"
      opacity="0.14"
    />
    <path
      d="M124 222 Q132 232 140 222"
      stroke="#FFD9B8"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />
  </g>
</svg>
